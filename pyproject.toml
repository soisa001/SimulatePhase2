[project]
name = "simulate-phase2"
version = "0.1.0"
description = "Per-population empirical SNV target maps and calibrated msprime simulations"
requires-python = ">=3.10"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "msprime>=1.3.3,<2",
  "numpy>=1.26",
  "tskit>=1.0,<2",
  "tszip>=0.2.5,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
